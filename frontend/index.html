<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Penny</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">Penny</div>
        <nav>
          <button class="nav-link active" data-view="dashboard">Dashboard</button>
          <button class="nav-link" data-view="transactions">Transactions</button>
          <button class="nav-link" data-view="budgets">Budgets</button>
          <button class="nav-link" data-view="categories">Categories</button>
          <button class="nav-link" data-view="tools">Imports</button>
          <button class="nav-link" data-view="profile">Profile</button>
        </nav>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Personal Finance Intelligence</p>
            <h1 id="view-title">Dashboard</h1>
          </div>
          <div class="auth-actions">
            <span id="user-label"></span>
            <button id="logout-btn" class="ghost hidden">Log out</button>
          </div>
        </header>

        <section id="auth-panel" class="auth-panel">
          <form id="auth-form">
            <h2>Sign in or create an account</h2>
            <input name="name" placeholder="Name">
            <input name="email" type="email" placeholder="Email" required>
            <input name="password" type="password" placeholder="Password" minlength="8" required>
            <div class="form-row">
              <button type="submit" data-mode="login">Log in</button>
              <button type="submit" data-mode="register" class="secondary">Register</button>
            </div>
            <p id="auth-error" class="error"></p>
          </form>
        </section>

        <section id="app-content" class="hidden">
          <section id="dashboard" class="view active">
            <div id="alert-list" class="alert-list"></div>
            <div class="metric-grid">
              <article><span>Income</span><strong id="metric-income">$0.00</strong></article>
              <article><span>Expenses</span><strong id="metric-expenses">$0.00</strong></article>
              <article><span>Cash flow</span><strong id="metric-cash-flow">$0.00</strong></article>
            </div>
            <div class="chart-grid">
              <div class="panel"><canvas id="trend-chart"></canvas></div>
              <div class="panel"><canvas id="category-chart"></canvas></div>
            </div>
          </section>

          <section id="transactions" class="view">
            <form id="transaction-form" class="panel form-grid">
              <select name="type">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
              <input name="merchant" placeholder="Merchant or source" required>
              <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
              <input name="transactionDate" type="date" required>
              <select name="categoryId" id="transaction-category"></select>
              <input name="notes" placeholder="Notes">
              <button type="submit">Add transaction</button>
            </form>
            <div class="toolbar">
              <input id="search" placeholder="Search ledger">
              <button id="export-btn" class="secondary">Export CSV</button>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Type</th><th>Amount</th><th></th></tr></thead>
                <tbody id="transaction-table"></tbody>
              </table>
            </div>
          </section>

          <section id="budgets" class="view">
            <form id="budget-form" class="panel form-grid">
              <input name="month" type="month" required>
              <select name="categoryId" id="budget-category"></select>
              <input name="limitAmount" type="number" step="0.01" min="0" placeholder="Monthly limit" required>
              <button type="submit">Save budget</button>
            </form>
            <div id="budget-list" class="budget-list"></div>
          </section>

          <section id="categories" class="view">
            <form id="category-form" class="panel form-grid">
              <input name="name" placeholder="Category name" required>
              <select name="type">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
              <input name="color" type="color" value="#2563eb" aria-label="Category color">
              <button type="submit">Add category</button>
            </form>
            <div id="category-list" class="category-list"></div>
          </section>

          <section id="tools" class="view">
            <div class="tool-grid">
              <form id="receipt-form" class="panel">
                <h2>Receipt scan</h2>
                <input name="receipt" type="file" accept="image/*" required>
                <button type="submit">Scan receipt</button>
                <pre id="receipt-result"></pre>
              </form>
              <form id="csv-form" class="panel">
                <h2>Statement import</h2>
                <input name="statement" type="file" accept=".csv,text/csv" required>
                <button type="submit">Import CSV</button>
                <p id="csv-result"></p>
              </form>
            </div>
          </section>

          <section id="profile" class="view">
            <form id="profile-form" class="panel form-grid">
              <input name="name" placeholder="Name" required>
              <input name="email" type="email" placeholder="Email" required>
              <input name="password" type="password" minlength="8" placeholder="New password">
              <button type="submit">Save profile</button>
            </form>
            <p id="profile-result"></p>
          </section>
        </section>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>

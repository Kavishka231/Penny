name: Release CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - release/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: penny_ci
          POSTGRES_USER: penny_ci
          POSTGRES_PASSWORD: penny_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U penny_ci -d penny_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgres://penny_ci:penny_ci_password@127.0.0.1:5432/penny_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run migrate

      - name: Run API and contract tests
        run: npm test

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Run browser and SMTP tests
        run: npm run test:browser

      - name: Check JavaScript syntax
        working-directory: .
        run: find backend/src backend/test frontend -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate production image
        working-directory: .
        run: docker build -f backend/Dockerfile .

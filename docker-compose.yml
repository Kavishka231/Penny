services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: penny
      POSTGRES_USER: penny
      POSTGRES_PASSWORD: penny
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penny -d penny"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://penny:penny@postgres:5432/penny
      JWT_SECRET: change-me-in-production
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./frontend:/app/public:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres-data:
